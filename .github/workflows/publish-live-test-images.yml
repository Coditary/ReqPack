name: Publish live test images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reqpack
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push live test base images
        env:
          LIVE_IMAGE_PUSH: '1'
          LIVE_IMAGE_REGISTRY: ghcr.io/coditary
        run: |
          bash scripts/publish-live-test-images.sh
